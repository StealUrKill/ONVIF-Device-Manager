name: ODM

on:
  pull_request:
    branches: [ "development" ]
  push:
    branches: [ "development" ]
    tags: ['v*']

jobs:

  build:

    environment: signing
    runs-on: windows-2022

    permissions:
      id-token: write
      contents: write

    env:
      Solution_Name: build.slnx
      # A tag build is a release build: no -dev suffix and no "(dev)" in the MSI name.
      Release_Args: ${{ startsWith(github.ref, 'refs/tags/v') && '/p:OdmRelease=true' || '' }}
      # Sign only tag builds, and only when all signing secrets are set. A step "if" cannot read secrets.
      Sign_Release: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CERT_PROFILE != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v4

    - name: Install .NET Framework targeting packs
      shell: pwsh
      run: |
        # Install .NET 4.0 and 4.5 reference assemblies via NuGet packages
        $nuget = "nuget"
        $outDir = "$env:TEMP\netfx-ref"
        & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -OutputDirectory $outDir -ExcludeVersion -NonInteractive
        & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -OutputDirectory $outDir -ExcludeVersion -NonInteractive

        $refRoot = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"

        # Copy .NET 4.0 reference assemblies
        $src40 = "$outDir\Microsoft.NETFramework.ReferenceAssemblies.net40\build\.NETFramework\v4.0"
        $dst40 = "$refRoot\v4.0"
        if (-not (Test-Path $dst40)) { New-Item -ItemType Directory -Path $dst40 | Out-Null }
        Copy-Item "$src40\*" $dst40 -Recurse -Force

        # Copy .NET 4.5 reference assemblies
        $src45 = "$outDir\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
        $dst45 = "$refRoot\v4.5"
        if (-not (Test-Path $dst45)) { New-Item -ItemType Directory -Path $dst45 | Out-Null }
        Copy-Item "$src45\*" $dst45 -Recurse -Force

        Write-Host "Targeting packs installed."

    - name: Check tag against version.json
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
        $tag = "${{ github.ref_name }}".TrimStart('v')
        if ($tag -ne $version) {
          Write-Error "Tag v$tag does not match version.json ($version). Change version.json or the tag."
          exit 1
        }
        Write-Host "Release version: $version"

    # One command builds the application, build\, the MSI and the portable exe (all in out\).
    - name: Build
      run: msbuild ${{ env.Solution_Name }} /restore /p:Configuration=Release /p:Platform=x64 /p:OdmBuildNumber=${{ github.run_number }} ${{ env.Release_Args }} /m /nologo /v:minimal

    - name: Restore tests
      run: dotnet restore odm\odm.tests\odm.tests.csproj

    - name: Build tests
      run: msbuild odm\odm.tests\odm.tests.csproj /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal

    - name: Run tests
      run: |
        $vstest = "${{ env.DevEnvDir }}CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        & $vstest "odm\odm.tests\bin\Any CPU\Debug\net48\odm.tests.dll" /logger:trx
      shell: pwsh

    - name: Verify required DLLs present
      shell: pwsh
      run: |
        $required = @(
          "build\odm.exe",
          "build\odm.player.net.dll",
          "build\odm.player.host.exe",
          "build\odm.player.media.dll",
          "build\avcodec-61.dll",
          "build\avformat-61.dll",
          "build\avutil-59.dll",
          "build\swscale-8.dll",
          "build\swresample-5.dll"
        )
        $missing = $required | Where-Object { -not (Test-Path $_) }
        if ($missing) {
          Write-Error "Missing required artifacts:`n$($missing -join "`n")"
          exit 1
        }
        $packages = @(Get-ChildItem out\*.msi) + @(Get-ChildItem out\*-portable.exe)
        if ($packages.Count -ne 2) {
          Write-Error "out\ must contain one MSI and one portable exe."
          exit 1
        }
        Write-Host "All required DLLs and packages present."

    - name: Note unsigned release
      if: startsWith(github.ref, 'refs/tags/v') && env.Sign_Release != 'true'
      run: echo "::warning::The signing secrets are not set. The MSI and the portable exe of this release are not signed."

    - name: Azure Login (OIDC)
      if: env.Sign_Release == 'true'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Sign application exe files
      if: env.Sign_Release == 'true'
      uses: azure/trusted-signing-action@v0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
        files-folder: out/package
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    # Make the packages again from the signed files in out\package\. OdmSkipStage keeps the folder as it is.
    - name: Package signed files
      if: env.Sign_Release == 'true'
      run: |
        msbuild installer\odm.installer.wixproj /p:Configuration=Release /p:Platform=x64 /p:OdmBuildNumber=${{ github.run_number }} ${{ env.Release_Args }} /p:OdmSkipStage=true /nologo /v:minimal
        msbuild installer\portable\odm.portable.csproj /p:Configuration=Release /p:Platform=x64 /p:OdmBuildNumber=${{ github.run_number }} ${{ env.Release_Args }} /p:OdmSkipStage=true /nologo /v:minimal

    - name: Sign packages
      if: env.Sign_Release == 'true'
      uses: azure/trusted-signing-action@v0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
        files-folder: out
        files-folder-filter: msi,exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: odm-installer
        path: out/*.msi

    - name: Upload portable exe
      uses: actions/upload-artifact@v4
      with:
        name: odm-portable
        path: out/*-portable.exe

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          out/*.msi
          out/*-portable.exe
